<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Zadanie 10</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      // KROK 1: Definicja funkcji
      function drukujLinie(ilosc){
        for(i=0;i<ilosc;i++){
          document.write("-");
        }
        document.write("<br>")
      }
    </script>
  </head>
  <body>
    <h1>Zadanie 10: Pętle</h1>
    <p>Generator linii.</p>
    <div id="wynik">
      <script>
        // KROK 2: Wywołania funkcji
        drukujLinie(10);
        drukujLinie(50);
        drukujLinie(5);
      </script>
    </div>
    <footer>
      <p>Bartosz Łabądź 4EI</p>
    </footer>
  </body>
</html>
